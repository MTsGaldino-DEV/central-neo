services:
  web:
    build:
      context: .
      args:
        - VITE_NEO_SUPABASE_URL=${VITE_NEO_SUPABASE_URL}
        - VITE_NEO_SUPABASE_ANON_KEY=${VITE_NEO_SUPABASE_ANON_KEY}
        - VITE_TRACEONE_SUPABASE_URL=${VITE_TRACEONE_SUPABASE_URL}
        - VITE_TRACEONE_SUPABASE_ANON_KEY=${VITE_TRACEONE_SUPABASE_ANON_KEY}
        - VITE_TRACEONE_URL=${VITE_TRACEONE_URL}
    image: central-neo-web
    expose:
      - "80"
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
